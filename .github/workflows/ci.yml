name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Lua runtime used by the test harness
        run: pip install lupa

      - name: Syntax-check every Lua source
        run: python tools/check.py

      - name: Boot Aurora and run the integration tests
        run: python tools/test_all.py

      - name: Check files.txt is up to date
        run: |
          python tools/make_manifest.py
          git diff --exit-code files.txt
